name: Validar e publicar no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Confirmar arquivo principal
        shell: bash
        run: test -f index.html

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar arquivos do site
        run: |
          mkdir public
          cp index.html public/
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
