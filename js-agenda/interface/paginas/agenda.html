<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Lista de Contato</title>
    <script type="module" src="../../controles/agendaDados.js"></script>
</head>

<body>

    <div class="menu-index">
        <span>Menu</span>
        <menu type="toolbar" class="opcao-menu">

            <div><a href="../index.html">Home</a></div>
            <div><a href="./contato.html">Cadastrar contato</a></div>

        </menu>
    </div>

    <div id="dados-container">
        <div id="busca-contato">

            <input id="input-busca" placeholder="digite os dados para busca">
            <button id="botao-busca">Buscar</button>

        </div>

        <span id="quantidade-contatos"></span>

    </div>

    <div id="tabela-container" class="lista-contato">
        <table id="tabela-contato">
            <thead>

                <th> # </th>
                <th> Nome </th>
                <th> Sobrenome </th>
                <th> Telefone </th>
                <th> Email </th>

            </thead>

        </table>
        <div>
            <span id="sem-contato" hidden></span>

        </div>
    </div>
    <div class="dialog-contato">
        
        <dialog id="modal-contato">
            <form id="formulario-modal">
                <div id="dados-pessoais">
                    <div id="campo-nome">
                        <label for="nome">Nome</label>
                        <input id="nome" name="nome" type="text" placeholder="Digite o nome do contato">
                        <span id="alerta-nome" hidden></span>
                    </div>

                    <div id="campo-sobrenome">
                        <label for="sobrenome">Sobrenome</label>
                        <input id="sobrenome" name="sobrenome" type="text" placeholder="Digite o sobrenome do contato">
                        <span id="alerta-sobrenome" hidden></span>
                    </div>

                </div>

                <div id="telefone">

                    <label for="telefone">Telefone</label>
                    <input id="telefone" name="telefone" type="text" placeholder="Digite o telefone">
                    <span id="alerta-telefone" hidden></span>

                </div>

                <div id="email">

                    <label for="email">Email</label>
                    <input id="email" name="email" type="text" placeholder="Digite o email contato">
                    <span id="alerta-email" hidden></span>

                </div>
                <div id="botao-form">
                    <button id="editar-form" type="submit">Editar</button>

                </div>

            </form>
            <button id="btn-excluir" type="submit">Excluir</button>
            <button id="btn-sair" type="submit">Sair</button>
        </dialog>

        <dialog id="modal-exclusao">
            <div>
                <span id="alerta-exclusao">Deseja realmente excluir o contato?</span>
                <button id="btn-sim">Sim</button>
                <button id="btn-nao">Não</button>
            </div>

        </dialog>
    </div>


</body>

</html>
